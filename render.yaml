# AllerCare AI V2 — $0 Render demo environment
#
# Both application services use Render's free web-service plan. The browser
# reaches Next.js, whose /api/* rewrite proxies to the API's public Render URL.
# This configuration is for synthetic demo data only: free services can sleep,
# uploads are ephemeral, and the free Postgres database expires after 30 days.
# LiveKit remains optional: add its Cloud URL/key/secret in the API service's
# Render Environment page after creating a LiveKit Cloud project.

services:
  - type: web
    name: allercare-v2-web
    runtime: docker
    region: singapore
    plan: free
    dockerContext: apps/web
    dockerfilePath: apps/web/Dockerfile
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_ORIGIN
        fromService:
          name: allercare-v2-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: allercare-v2-api
    runtime: docker
    region: singapore
    plan: free
    dockerContext: services/api
    dockerfilePath: services/api/Dockerfile
    healthCheckPath: /api/v1/healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: allercare-v2-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          name: allercare-v2-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATA_DIR
        value: /srv/data
      - key: UPLOAD_DIR
        value: /srv/uploads
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ON_START
        value: "1"
      - key: AI_PROVIDER
        value: mock

databases:
  - name: allercare-v2-db
    databaseName: allercare
    user: allercare
    postgresMajorVersion: "16"
    region: singapore
    plan: free
    ipAllowList: []
